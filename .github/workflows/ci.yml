# Build + CPU tests on GitHub-hosted runners (no GPU). GPU tests run on a self-hosted V100 runner, manually.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.5.1-devel-ubuntu22.04   # nvcc for sm_70; no GPU needed to compile
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl build-essential pkg-config git
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked --lib
      - run: cargo test --release --locked --test server_api
      - run: cargo clippy --release --locked -- -D clippy::correctness
  licenses:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2     # license allowlist + advisories (deny.toml)
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # free gitleaks CLI (gitleaks-action@v2 needs a paid license for organizations); pinned version + sha256
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="--all"
  # gpu:
  #   runs-on: [self-hosted, v100]       # only after a security review: never on pull_request from forks
  #   if: github.event_name == 'workflow_dispatch'
